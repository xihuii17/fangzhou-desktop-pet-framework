<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>桌宠</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 300px;
      height: 360px;
      transform-origin: left top;
      overflow: hidden;
    }

    #bubble {
      position: absolute;
      z-index: 4;
      top: 12px;
      left: 50%;
      max-width: 276px;
      min-height: 47px;
      padding: 11px 16px;
      border: 1px solid rgba(34, 42, 43, 0.16);
      border-radius: 8px;
      color: #263033;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 22px rgba(22, 32, 35, 0.15);
      font-size: 17.5px;
      line-height: 24px;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, -5px) scale(0.97);
      transition: opacity 150ms ease, transform 180ms ease;
      pointer-events: none;
    }

    #bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 10px;
      height: 10px;
      border-right: 1px solid rgba(34, 42, 43, 0.16);
      border-bottom: 1px solid rgba(34, 42, 43, 0.16);
      background: rgba(255, 255, 255, 0.96);
      transform: translateX(-50%) rotate(45deg);
    }

    #bubble.visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #pet-zone {
      position: absolute;
      inset: 62px 0 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    #pet-zone.dragging { cursor: grabbing; }

    #sky-gift {
      position: absolute;
      z-index: 7;
      top: 112px;
      right: 18px;
      display: none;
      width: 58px;
      height: 58px;
      padding: 0;
      border: 1px solid rgba(151, 102, 42, 0.28);
      border-radius: 18px;
      color: #fff7df;
      background: linear-gradient(145deg, #e6b25b, #b97832);
      box-shadow: 0 9px 22px rgba(93, 58, 24, 0.26);
      font-size: 31px;
      cursor: pointer;
      transform-origin: center bottom;
      animation: gift-arrive 520ms cubic-bezier(.2, .9, .28, 1.15), gift-float 2.4s ease-in-out 520ms infinite;
    }

    #sky-gift.visible { display: grid; place-items: center; }
    #sky-gift:hover { filter: brightness(1.05); }
    #sky-gift:active { transform: translateY(2px) scale(0.96); }

    #sky-gift-count {
      position: absolute;
      top: -5px;
      right: -5px;
      display: none;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border: 2px solid rgba(255, 255, 255, 0.94);
      border-radius: 10px;
      color: #fff;
      background: #bf6947;
      font-size: 11px;
      font-weight: 750;
      line-height: 16px;
    }

    #sky-gift-count.visible { display: block; }

    #small-gift {
      position: absolute;
      z-index: 7;
      top: 178px;
      right: 18px;
      display: none;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid rgba(82, 125, 112, 0.28);
      border-radius: 17px;
      color: #fff;
      background: linear-gradient(145deg, #77ac9c, #4f897a);
      box-shadow: 0 9px 22px rgba(44, 92, 79, 0.24);
      font-size: 27px;
      cursor: pointer;
      animation: gift-arrive 520ms cubic-bezier(.2, .9, .28, 1.15), gift-float 2.4s ease-in-out 520ms infinite;
    }

    #small-gift.visible { display: grid; place-items: center; }
    #small-gift:hover { filter: brightness(1.06); }
    #small-gift:active { transform: translateY(2px) scale(0.96); }

    #gift-countdown {
      position: absolute;
      z-index: 6;
      top: 187px;
      right: 12px;
      display: block;
      padding: 7px 10px;
      border: 1px solid rgba(151, 102, 42, 0.2);
      border-radius: 14px;
      color: #73512b;
      background: rgba(255, 250, 237, 0.94);
      box-shadow: 0 6px 16px rgba(71, 48, 23, 0.14);
      font-size: 12px;
      font-weight: 720;
      line-height: 17px;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    #gift-countdown[hidden] { display: none; }

    #stage:hover #gift-countdown.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #gift-reward {
      position: absolute;
      z-index: 8;
      top: 80px;
      right: 8px;
      display: none;
      min-width: 118px;
      max-width: 180px;
      padding: 9px 13px;
      border: 1px solid rgba(151, 102, 42, 0.22);
      border-radius: 12px;
      color: #62451f;
      background: rgba(255, 249, 232, 0.97);
      box-shadow: 0 8px 22px rgba(71, 48, 23, 0.2);
      font-size: 13px;
      font-weight: 700;
      line-height: 19px;
      text-align: center;
      pointer-events: none;
      animation: reward-rise 220ms ease-out;
    }

    #gift-reward.visible { display: block; }

    @keyframes gift-arrive {
      from { opacity: 0; transform: translateY(-24px) rotate(-12deg) scale(0.7); }
      to { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
    }

    @keyframes gift-float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    @keyframes reward-rise {
      from { opacity: 0; transform: translateY(8px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pet-layer {
      position: absolute;
      left: 4px;
      bottom: 0;
      display: block;
      width: 292px;
      height: 292px;
      object-fit: contain;
      object-position: center bottom;
      pointer-events: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 4px 3px rgba(15, 25, 27, 0.14));
      transform-origin: center bottom;
      opacity: 0;
      transform: translateY(2px) scale(0.988);
      transition: opacity var(--fade-duration, 140ms) ease, transform var(--fade-duration, 140ms) ease;
    }

    .pet-layer.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #toolbar {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: var(--toolbar-top, 203px);
      display: flex;
      width: max-content;
      height: 42px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      background: rgba(248, 250, 249, 0.94);
      box-shadow: 0 2px 6px rgba(14, 20, 22, 0.12);
      opacity: 0;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    #toolbar.visible,
    #toolbar:focus-within {
      opacity: 1;
      pointer-events: auto;
    }

    .tool-button {
      position: relative;
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      place-items: center;
      color: #455e59;
      background: transparent;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    .tool-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .tool-button:hover { background: rgba(72, 119, 107, 0.12); }
    .tool-button:focus-visible { outline: 2px solid #508479; outline-offset: 1px; }
    @media (prefers-reduced-motion: reduce) { #toolbar { transition: none; } }
    .tool-button:active { transform: translateY(1px); }
    .tool-button.active { color: #f2c462; background: rgba(255, 255, 255, 0.12); }

    .tool-button.has-gift::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      background: #d89452;
      box-shadow: 0 1px 4px rgba(94, 58, 25, 0.25);
    }

    #lyrics {
      position: fixed;
      z-index: 5;
      left: 50%;
      top: var(--lyrics-top, 203px);
      bottom: auto;
      display: none;
      width: var(--lyrics-base-width, min(280px, calc(100vw - 12px)));
      min-height: 76px;
      padding: 9px 12px 8px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 18px;
      color: #344e47;
      background: rgba(248, 250, 249, 0.94);
      box-shadow: 0 2px 6px rgba(14, 20, 22, 0.12);
      text-align: center;
      transform: translateX(-50%) scale(var(--lyrics-scale, 1));
      transform-origin: top center;
      pointer-events: none;
    }

    #lyrics.visible { display: grid; align-content: center; gap: 2px; pointer-events: auto; }

    #lyrics-title {
      overflow: hidden;
      color: #6e837c;
      font-size: 10px;
      line-height: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #lyrics-current {
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      line-height: 19px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #lyrics-next {
      overflow: hidden;
      color: #6e837c;
      font-size: 11px;
      line-height: 16px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="桌宠">
    <div id="bubble" role="status" aria-live="polite"></div>
    <button id="sky-gift" type="button" title="查看随机礼物盲盒" aria-label="查看随机礼物盲盒">
      🎁<span id="sky-gift-count" aria-hidden="true"></span>
    </button>
    <button id="small-gift" type="button" title="领取陪伴小礼物 · 30积分" aria-label="领取陪伴小礼物，获得30积分">✦</button>
    <div id="gift-countdown" role="status"></div>
    <div id="gift-reward" role="status" aria-live="polite"></div>
    <div id="pet-zone">
      <img class="pet-layer" id="pet-a" alt="桌宠角色" draggable="false">
      <img class="pet-layer" id="pet-b" alt="" aria-hidden="true" draggable="false">
    </div>
  </main>
  <div id="lyrics" role="status" aria-live="polite">
    <div id="lyrics-title"></div>
    <div id="lyrics-current"></div>
    <div id="lyrics-next"></div>
  </div>
  <div id="toolbar" aria-label="快捷操作">
    <button class="tool-button" id="growth-button" type="button" title="陪伴 · 等级与商店" aria-label="陪伴 · 等级与商店"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button>
    <button class="tool-button" id="manager-button" type="button" title="动作库" aria-label="动作库"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 14s1.2 3 4 3 4-3 4-3M8 8v1M16 8v1"/></svg></button>
    <button class="tool-button" id="settings-button" type="button" title="设置" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <script src="mode-idle.js"></script>
  <script>
    const stage = document.getElementById('stage');
    const petZone = document.getElementById('pet-zone');
    const petImages = [document.getElementById('pet-a'), document.getElementById('pet-b')];
    const bubble = document.getElementById('bubble');
    const skyGift = document.getElementById('sky-gift');
    const skyGiftCount = document.getElementById('sky-gift-count');
    const smallGift = document.getElementById('small-gift');
    const giftCountdown = document.getElementById('gift-countdown');
    const giftReward = document.getElementById('gift-reward');
    const toolbar = document.getElementById('toolbar');
    let toolbarHideTimer = null;
    function showToolbar() {
      window.clearTimeout(toolbarHideTimer);
      toolbar.classList.add('visible');
    }
    function scheduleToolbarHide() {
      window.clearTimeout(toolbarHideTimer);
      toolbarHideTimer = window.setTimeout(() => toolbar.classList.remove('visible'), 650);
    }
    for (const surface of [petZone, toolbar, skyGift, smallGift]) {
      surface.addEventListener('pointerenter', showToolbar);
      surface.addEventListener('pointerleave', scheduleToolbarHide);
    }
    toolbar.addEventListener('focusin', showToolbar);
    toolbar.addEventListener('focusout', scheduleToolbarHide);
    window.addEventListener('blur', scheduleToolbarHide);
    const lyricsPanel = document.getElementById('lyrics');
    // Keep the toolbar reachable while the pointer crosses the lyrics panel.
    lyricsPanel.addEventListener('pointerenter', showToolbar);
    lyricsPanel.addEventListener('pointerleave', scheduleToolbarHide);
    const lyricsTitle = document.getElementById('lyrics-title');
    const lyricsCurrent = document.getElementById('lyrics-current');
    const lyricsNext = document.getElementById('lyrics-next');

    document.body.classList.toggle('platform-windows', window.companionAPI.platform === 'win32');

    let config = null;
    let actions = [];
    let actionMap = new Map();
    let actionTimer = null;
    let returnTimer = null;
    let bubbleTimer = null;
    let giftRewardTimer = null;
    let pendingGifts = [];
    let giftCountdownSeconds = 0;
    let smallGiftReady = false;
    let autoTimer = null;
    let pointerState = null;
    let holdTimer = null;
    let tapTimer = null;
    let lastTapAt = 0;
    let isDragging = false;
    let currentActionId = 'idle';
    let activeImageIndex = 0;
    let imageRevision = 0;
    let playbackToken = 0;
    let phase = 'boot';
    let playOrder = 0;
    const actionLastPlayed = new Map();

    const frequencyRanges = {
      frequent: [10000, 24000],
      normal: [24000, 52000],
      rare: [60000, 120000]
    };

    const randomItem = (items) => items[Math.floor(Math.random() * items.length)];

    function currentMode() {
      return ['quiet', 'daily', 'office'].includes(config?.activityMode)
        ? config.activityMode
        : 'daily';
    }

    function actionBehaviorId(action) {
      return action?.behaviorId || action?.id || null;
    }

    function actionIdFor(reference) {
      if (!reference) return null;
      if (actionMap.has(reference)) return reference;
      return actions.find((action) => actionBehaviorId(action) === reference)?.id || null;
    }

    function rememberAction(id) {
      currentActionId = id;
      playOrder += 1;
      actionLastPlayed.set(id, playOrder);
    }

    function randomAction(pool, extraExcluded = []) {
      const uniquePool = [...new Set(pool)].filter((id) => actionMap.has(id));
      if (!uniquePool.length) return actionIdFor('idle');

      const excluded = new Set(extraExcluded);
      if (uniquePool.length > 1) excluded.add(currentActionId);
      const available = uniquePool.filter((id) => !excluded.has(id));
      const candidates = available.length ? available : uniquePool;
      const unseen = candidates.filter((id) => !actionLastPlayed.has(id));
      if (unseen.length) return randomItem(unseen);

      const oldestOrder = Math.min(...candidates.map((id) => actionLastPlayed.get(id) || 0));
      return randomItem(candidates.filter((id) => (actionLastPlayed.get(id) || 0) === oldestOrder));
    }

    function stableActionId() {
      if (config?.pinnedAction && actionMap.has(config.pinnedAction)) return config.pinnedAction;
      return ModeIdle.resolve(config || {}, actions);
    }

    function clearEventTimers() {
      window.clearTimeout(actionTimer);
      window.clearTimeout(returnTimer);
      window.clearTimeout(autoTimer);
    }

    function beginEvent(kind) {
      playbackToken += 1;
      clearEventTimers();
      phase = kind;
      return playbackToken;
    }

    let firstFrameSent = false;
    function reportFirstFrame(error = null) {
      if (firstFrameSent) return;
      firstFrameSent = true;
      window.requestAnimationFrame(() => window.requestAnimationFrame(() => {
        window.companionAPI.rendererReady?.(error);
      }));
    }

    function displayAction(action, transitionMs = 140, shouldRemember = true) {
      if (!action) return;
      currentActionId = action.id;
      if (shouldRemember && action.id !== stableActionId()) rememberAction(action.id);

      const nextIndex = 1 - activeImageIndex;
      const revision = ++imageRevision;
      const currentImage = petImages[activeImageIndex];
      const nextImage = petImages[nextIndex];
      const mediaUrl = action.mediaUrl || '';
      if (!mediaUrl) return;
      nextImage.style.setProperty('--fade-duration', `${transitionMs}ms`);
      currentImage.style.setProperty('--fade-duration', `${transitionMs}ms`);
      nextImage.classList.remove('visible');
      nextImage.removeAttribute('src');
      nextImage.onload = () => {
        if (revision !== imageRevision) return;
        window.requestAnimationFrame(() => {
          if (revision !== imageRevision) return;
          nextImage.classList.add('visible');
          currentImage.classList.remove('visible');
          activeImageIndex = nextIndex;
          reportFirstFrame();
        });
      };
      nextImage.onerror = () => {
        if (revision === imageRevision) reportFirstFrame('角色图片加载失败，请检查角色素材或通过设置重试。');
      };
      window.requestAnimationFrame(() => { nextImage.src = mediaUrl; });
    }

    function returnToBase(token = playbackToken, immediate = false) {
      if (token !== playbackToken) return;
      window.clearTimeout(actionTimer);
      window.clearTimeout(returnTimer);
      phase = 'returning';
      setBubble(null);
      returnTimer = window.setTimeout(() => {
        if (token !== playbackToken) return;
        const action = actionMap.get(stableActionId());
        if (!action) return;
        displayAction(action, immediate ? 0 : 280, false);
        phase = 'base';
        scheduleAutoAction();
      }, immediate ? 0 : 650);
    }

    function updateScale() {
      if (!config) return;
      const scale = Number(config.scale) || 1;
      stage.style.transform = `scale(${scale})`;
      stage.style.left = `${Math.max(0, (window.innerWidth - 300 * scale) / 2)}px`;
      // Keep both panels attached to the pet, never to the native window bottom.
      const petBottom = Math.round(360 * scale);
      const lyricsScale = Math.min(1.6, Math.max(0.7, Number(config.lyricsScale) || 1));
      document.documentElement.style.setProperty('--lyrics-scale', String(lyricsScale));
      document.documentElement.style.setProperty('--lyrics-base-width', `${Math.min(280, Math.max(1, (window.innerWidth - 12) / lyricsScale))}px`);
      const lyricsHeight = lyricsPanel.classList.contains('visible') ? Math.ceil(76 * lyricsScale) + 10 : 0;
      document.documentElement.style.setProperty('--lyrics-top', `${petBottom + 5}px`);
      document.documentElement.style.setProperty('--toolbar-top', `${petBottom + 5 + lyricsHeight}px`);
    }

    function updateBubbleScale() {
      if (!config) return;
      const scale = Math.min(1.25, Math.max(0.65, Number(config.bubbleScale) || 1));
      bubble.style.maxWidth = `${Math.min(288, 276 * scale)}px`;
      bubble.style.minHeight = `${47 * scale}px`;
      bubble.style.padding = `${11 * scale}px ${16 * scale}px`;
      bubble.style.fontSize = `${17.5 * scale}px`;
      bubble.style.lineHeight = `${24 * scale}px`;
    }

    function setBubble(line, duration = 3200, force = false) {
      window.clearTimeout(bubbleTimer);
      if (!line || (!force && (!config?.speechEnabled || currentMode() === 'quiet'))) {
        bubble.classList.remove('visible');
        return;
      }
      bubble.textContent = line;
      bubble.classList.add('visible');
      bubbleTimer = window.setTimeout(() => bubble.classList.remove('visible'), duration);
    }

    function contextPool() {
      const mode = currentMode();
      return actions
        .filter((action) => (
          !action.interaction &&
          !action.sequenceOnly &&
          action.modes?.includes(mode) &&
          !['drag', 'idle'].includes(actionBehaviorId(action)) &&
          action.id !== stableActionId()
        ))
        .map((action) => action.id);
    }

    function playAction(id, forcedLine = null, options = {}) {
      const resolvedId = id === 'random' ? randomAction(contextPool()) : actionIdFor(id);
      const action = actionMap.get(resolvedId) || actionMap.get(actionIdFor('idle'));
      if (!action) return;
      const token = options.token || beginEvent(options.kind || 'manual');
      if (token !== playbackToken) return;
      phase = options.kind || phase;
      window.clearTimeout(actionTimer);
      displayAction(action, options.transitionMs ?? 140);

      const line = forcedLine || (action.lines?.length ? randomItem(action.lines) : null);
      const speechDuration = line ? Math.min(4600, 1300 + line.length * 150) : 0;
      const duration = Math.max(action.playMs || 2800, speechDuration);
      if (options.silent !== true) setBubble(line, duration + 350, options.forceSpeech === true);

      if (!options.persistent && action.playMs > 0) {
        actionTimer = window.setTimeout(() => {
          if (token !== playbackToken) return;
          if (options.onComplete) options.onComplete(token);
          else returnToBase(token);
        }, duration);
      }
      return token;
    }

    function canAutoPlay() {
      return Boolean(config?.autoActionEnabled && !config.pinnedAction && !isDragging && phase === 'base');
    }

    function playAutoSequence() {
      if (!canAutoPlay()) return;
      const pool = contextPool();
      if (!pool.length) {
        scheduleAutoAction();
        return;
      }
      const mode = currentMode();
      const firstId = randomAction(pool);
      const firstBehaviorId = actionBehaviorId(actionMap.get(firstId));
      const token = beginEvent('auto');
      if (mode === 'quiet' && firstBehaviorId === 'sleep' && actionIdFor('sleep-prep1')) {
        playAction('sleep-prep1', null, {
          token,
          kind: 'auto',
          onComplete: () => playAction('sleep-prep2', null, {
            token,
            kind: 'auto',
            onComplete: () => playAction('sleep', null, { token, kind: 'auto' })
          })
        });
        return;
      }
      if (mode === 'office' && firstBehaviorId === 'work') {
        const followUp = randomAction(
          ['typing', 'work-tired', 'work-doze'].map(actionIdFor).filter(Boolean),
          [firstId]
        );
        playAction('work', null, {
          token,
          kind: 'auto',
          onComplete: () => playAction(followUp, null, { token, kind: 'auto' })
        });
        return;
      }
      playAction(firstId, null, { token, kind: 'auto' });
    }

    function scheduleAutoAction() {
      window.clearTimeout(autoTimer);
      if (!canAutoPlay()) return;
      const [minimum, maximum] = frequencyRanges[config.actionFrequency] || frequencyRanges.normal;
      const lowPowerMultiplier = config.lowPowerMode ? 2.5 : 1;
      const delay = (minimum + Math.random() * (maximum - minimum)) * lowPowerMultiplier;
      autoTimer = window.setTimeout(() => {
        playAutoSequence();
      }, delay);
    }

    function applyConfig(nextConfig) {
      const stableChanged = config && (
        config.pinnedAction !== nextConfig.pinnedAction ||
        config.baseAction !== nextConfig.baseAction ||
        JSON.stringify(config.modeIdleActions) !== JSON.stringify(nextConfig.modeIdleActions) ||
        config.activityMode !== nextConfig.activityMode ||
        config.appearanceId !== nextConfig.appearanceId
      );
      config = nextConfig;
      renderGiftCountdown();
      if (!config.lyricsEnabled) lyricsPanel.classList.remove('visible');
      updateScale();
      updateBubbleScale();
      if (currentMode() === 'quiet' || !config.speechEnabled) setBubble(null);
      if (stableChanged && actionMap.size) {
        const token = beginEvent('returning');
        returnToBase(token, true);
      } else if (phase === 'base') {
        scheduleAutoAction();
      }
    }

    function interactionPool() {
      const pool = actions.filter((action) => action.interaction).map((action) => action.id);
      return pool.length
        ? pool
        : ['pat', 'head-rub', 'cheek-squeeze', 'nose-poke'].map(actionIdFor).filter(Boolean);
    }

    function draggingPool() {
      return actions.filter((action) => action.dragging).map((action) => action.id);
    }

    function dropReactionPool() {
      return actions.filter((action) => action.dropReaction).map((action) => action.id);
    }

    function singleTap(localY) {
      playAction(randomAction(interactionPool()), null, { kind: 'interaction' });
    }

    function doubleTap() {
      const preferred = ['heart', 'gift', 'rose', 'celebrate']
        .map(actionIdFor)
        .filter((id) => actionMap.get(id)?.interaction);
      playAction(randomAction(preferred.length ? preferred : interactionPool()), null, { kind: 'interaction' });
    }

    function handleTap(localY) {
      const now = Date.now();
      if (now - lastTapAt < 310) {
        window.clearTimeout(tapTimer);
        lastTapAt = 0;
        doubleTap();
        return;
      }
      lastTapAt = now;
      tapTimer = window.setTimeout(() => {
        lastTapAt = 0;
        singleTap(localY);
      }, 250);
    }

    petZone.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      event.preventDefault();
      pointerState = {
        pointerId: event.pointerId,
        screenX: event.screenX,
        screenY: event.screenY,
        localY: event.clientY - petZone.getBoundingClientRect().top,
        moved: false,
        reacted: false,
        held: false
      };
      window.clearTimeout(holdTimer);
      window.clearTimeout(autoTimer);
      holdTimer = window.setTimeout(() => {
        if (!pointerState || pointerState.moved) return;
        pointerState.held = true;
        playAction(randomAction(interactionPool()), null, { kind: 'interaction' });
      }, 560);
      petZone.setPointerCapture(event.pointerId);
      window.companionAPI.dragStart();
    });

    petZone.addEventListener('pointermove', (event) => {
      if (!pointerState || pointerState.pointerId !== event.pointerId) return;
      if ((event.buttons & 1) === 0) {
        endPointer(event);
        return;
      }
      const distance = Math.hypot(event.screenX - pointerState.screenX, event.screenY - pointerState.screenY);
      if (distance > 4) pointerState.moved = true;
      if (!pointerState.moved) return;
      window.clearTimeout(holdTimer);
      const dragJustStarted = !isDragging;
      isDragging = true;
      window.clearTimeout(autoTimer);
      petZone.classList.add('dragging');
      document.body.classList.add('pet-dragging');
      if (dragJustStarted || window.companionAPI.platform !== 'win32') {
        window.companionAPI.dragMove();
      }
      if (!pointerState.reacted) {
        pointerState.reacted = true;
        const pool = draggingPool();
        if (pool.length) playAction(randomAction(pool), null, { persistent: true, kind: 'drag' });
      }
    });

    function endPointer(event) {
      if (!pointerState || pointerState.pointerId !== event.pointerId) return;
      const { moved, localY, held } = pointerState;
      pointerState = null;
      window.clearTimeout(holdTimer);
      isDragging = false;
      petZone.classList.remove('dragging');
      document.body.classList.remove('pet-dragging');
      window.companionAPI.dragEnd();
      if (moved) {
        const token = beginEvent('interaction');
        returnTimer = window.setTimeout(() => {
          if (token !== playbackToken) return;
          const pool = dropReactionPool();
          const actionId = pool.length ? randomAction(pool) : null;
          if (actionId) playAction(actionId, null, { token, kind: 'interaction' });
          else returnToBase(token);
        }, 160);
      } else if (!held) {
        handleTap(localY);
      }
    }

    petZone.addEventListener('pointerup', endPointer);
    petZone.addEventListener('pointercancel', endPointer);
    petZone.addEventListener('lostpointercapture', endPointer);
    window.addEventListener('blur', () => {
      if (pointerState) endPointer({ pointerId: pointerState.pointerId });
    });
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      window.companionAPI.showContextMenu();
    });

    const growthButton = document.getElementById('growth-button');
    growthButton.addEventListener('click', () => window.companionAPI.openGrowthCenter());
    const showGiftReward = (reward) => {
      window.clearTimeout(giftRewardTimer);
      giftReward.textContent = reward?.type === 'points'
        ? `心意积分 +${reward.points}`
        : (reward?.type === 'action'
          ? `获得新动作 · ${reward.label}`
          : `获得${reward?.label || '一份奖励'}`);
      giftReward.classList.add('visible');
      giftRewardTimer = window.setTimeout(() => giftReward.classList.remove('visible'), 5200);
    };
    const formatGiftCountdown = (seconds) => {
      const safeSeconds = Math.max(0, Math.ceil(Number(seconds) || 0));
      const minutes = Math.floor(safeSeconds / 60);
      const remainder = String(safeSeconds % 60).padStart(2, '0');
      return `${String(minutes).padStart(2, '0')}:${remainder}`;
    };
    const renderGiftCountdown = () => {
      const visible = config?.showGiftCountdown !== false && !smallGiftReady;
      giftCountdown.hidden = !visible;
      giftCountdown.classList.toggle('visible', visible);
      if (!visible) return;
      giftCountdown.textContent = giftCountdownSeconds > 0
        ? `小礼物 ${formatGiftCountdown(giftCountdownSeconds)}`
        : '小礼物准备中';
      giftCountdown.title = '鼠标移开后隐藏 · 领取后重新计时30分钟';
    };
    const renderGrowthNotice = (status) => {
      pendingGifts = status?.giftInbox || [];
      giftCountdownSeconds = status?.today?.nextSmallGiftInSeconds || 0;
      smallGiftReady = Boolean(status?.today?.smallGiftReady);
      const giftCount = pendingGifts.length;
      growthButton.classList.toggle('has-gift', giftCount > 0);
      growthButton.title = giftCount > 0 ? `陪伴（${giftCount} 份礼物待打开）` : '陪伴 · 等级与商店';
      growthButton.setAttribute('aria-label', growthButton.title);
      skyGift.classList.toggle('visible', giftCount > 0);
      skyGiftCount.textContent = giftCount > 1 ? giftCount : '';
      skyGiftCount.classList.toggle('visible', giftCount > 1);
      skyGift.title = giftCount > 1 ? `查看随机礼物盲盒（待打开 ${giftCount} 份）` : '查看随机礼物盲盒';
      smallGift.classList.toggle('visible', smallGiftReady);
      renderGiftCountdown();
    };
    skyGift.addEventListener('click', (event) => {
      event.stopPropagation();
      window.companionAPI.openGrowthCenter();
    });
    smallGift.addEventListener('click', async (event) => {
      event.stopPropagation();
      if (!smallGiftReady) return;
      smallGift.disabled = true;
      try {
        const result = await window.companionAPI.collectGrowthSmallGift();
        if (result?.ok) {
          renderGrowthNotice(result.status);
          showGiftReward(result.reward);
        } else {
          showGiftReward({ label: result?.message || '礼物打开失败' });
        }
      } finally {
        smallGift.disabled = false;
      }
    });
    window.companionAPI.onGrowthChanged(renderGrowthNotice);
    window.companionAPI.getGrowthStatus().then(renderGrowthNotice);
    window.setInterval(() => {
      if (smallGiftReady || giftCountdownSeconds <= 0) return;
      giftCountdownSeconds -= 1;
      renderGiftCountdown();
    }, 1000);
    document.getElementById('manager-button').addEventListener('click', () => window.companionAPI.openActionManager());
    document.getElementById('settings-button').addEventListener('click', () => window.companionAPI.openSettings());

    window.companionAPI.onConfigChanged(async (nextConfig) => {
      if (config && config.appearanceId !== nextConfig.appearanceId) {
        actions = await window.companionAPI.getActions();
        actionMap = new Map(actions.map((action) => [action.id, action]));
      }
      applyConfig(nextConfig);
    });
    window.addEventListener('resize', updateScale);
    window.companionAPI.onPlayAction(({ id, line, action }) => {
      if (action) actionMap.set(action.id, action);
      playAction(id, line, { kind: 'manual' });
    });
    window.companionAPI.onActionsChanged(async () => {
      actions = await window.companionAPI.getActions();
      actionMap = new Map(actions.map((action) => [action.id, action]));
      if (phase === 'base' && !isDragging) {
        const token = beginEvent('returning');
        returnToBase(token, true);
      }
    });
    window.companionAPI.onLyricsChanged((payload) => {
      if (!payload?.visible || !config?.lyricsEnabled) {
        lyricsPanel.classList.remove('visible');
        updateScale();
        return;
      }
      lyricsTitle.textContent = payload.title || '通用同步歌词';
      lyricsCurrent.textContent = payload.current || '♪';
      lyricsNext.textContent = payload.next || '';
      lyricsPanel.classList.add('visible');
      updateScale();
    });
    Promise.all([
      window.companionAPI.getCharacter(),
      window.companionAPI.getConfig(),
      window.companionAPI.getActions()
    ]).then(async ([character, initialConfig, loadedActions]) => {
      document.title = character.productName;
      stage.setAttribute('aria-label', character.productName);
      petImages[0].alt = character.name;
      actions = loadedActions;
      actionMap = new Map(actions.map((action) => [action.id, action]));
      applyConfig(initialConfig);
      if (initialConfig.firstLaunch) {
        await window.companionAPI.saveConfig({ firstLaunch: false });
        window.setTimeout(() => playAction(character.greetingAction, character.greeting, { kind: 'interaction' }), 280);
      } else {
        const token = beginEvent('returning');
        returnToBase(token, true);
      }
    }).catch(error => reportFirstFrame(`桌宠初始化失败：${error?.message || error}`));
  </script>
</body>
</html>
